<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HP Karakterku</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LOCK SCREEN -->
  <div id="lockscreen" class="screen">
    <div class="time" id="time">12:00</div>
    <div class="date" id="date">Jumat, 23 Oktober</div>
    <p class="swipe">Geser ke atas untuk membuka</p>

    <div id="passcode-screen" class="hidden">
      <p>Masukkan Kode Sandi</p>
      <p class="hint">Hint: tulis hint kamu di sini</p>
      <input type="password" id="passcode" maxlength="6" placeholder="••••••">
      <br>
      <button onclick="checkPasscode()">Buka</button>
      <button onclick="cancelPasscode()">Batal</button>
    </div>
  </div>

  <!-- HOME SCREEN -->
  <div id="homescreen" class="screen hidden">
    <div class="status-bar">
      <span id="home-time">12:00</span>
    </div>

    <div class="apps">
      <div class="app" onclick="openApp('whatsapp')">
        <div class="icon whatsapp">💬</div>
        <span>WhatsApp</span>
      </div>
      <div class="app" onclick="openApp('instagram')">
        <div class="icon instagram">📷</div>
        <span>Instagram</span>
      </div>
      <div class="app" onclick="openApp('notes')">
        <div class="icon notes">📝</div>
        <span>Notes</span>
      </div>
      <div class="app" onclick="openApp('safari')">
        <div class="icon safari">🧭</div>
        <span>Safari</span>
      </div>
    </div>
  </div>

  <!-- WHATSAPP -->
  <div id="whatsapp" class="app-screen hidden">
    <div class="app-header">
      <button onclick="closeApp()">←</button>
      <h2>WhatsApp</h2>
    </div>
    <div class="content" id="whatsapp-list"></div>
  </div>

  <!-- INSTAGRAM DM -->
  <div id="instagram" class="app-screen hidden">
    <div class="app-header">
      <button onclick="closeApp()">←</button>
      <h2>Instagram</h2>
    </div>
    <div class="content" id="instagram-list"></div>
  </div>

  <!-- NOTES -->
  <div id="notes" class="app-screen hidden">
    <div class="app-header">
      <button onclick="closeApp()">←</button>
      <h2>Notes</h2>
    </div>
    <div class="content" id="notes-content"></div>
  </div>

  <!-- SAFARI -->
  <div id="safari" class="app-screen hidden">
    <div class="app-header">
      <button onclick="closeApp()">←</button>
      <h2>Safari</h2>
    </div>
    <div class="content" id="safari-content"></div>
  </div>

  <!-- HALAMAN CHAT (dipakai bersama) -->
  <div id="chat-detail" class="app-screen hidden">
    <div class="app-header">
      <button onclick="backToList()">←</button>
      <h2 id="chat-name">Chat</h2>
    </div>
    <div class="content" id="chat-messages"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
